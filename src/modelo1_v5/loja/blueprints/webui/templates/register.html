{% extends 'base.html' %}

{% block title %}Cadastro de Usuário{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Criar Nova Conta</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Usuário</label>
                            <input type="text" class="form-control" id="username" name="username" required placeholder="Escolha seu nome de usuário">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Senha</label>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="Digite sua senha">
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label fw-semibold">Confirme a Senha</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Repita a senha">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">
                            Cadastrar
                        </button>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <small class="text-muted">Já possui uma conta? <a href="{{ url_for('webui.login') }}">Faça Login</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
